<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>集結計算</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="集結計算">
<meta name="theme-color" id="meta-theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="files/icon-180.png">
<link rel="icon" href="files/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* 本体スクリプトより先に外観を確定させ、切り替わりのチラつきを防ぐ */
(function(){
  var t = 'auto';
  try{ t = localStorage.getItem('shuketsu.theme') || 'auto'; }catch(e){}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root{
  --tint:#007AFF;
  --red:#FF3B30;
  --green:#34C759;
  --orange:#FF9500;
  --gray:#8E8E93;
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --sep: rgba(60,60,67,0.29);
  --label:#000000;
  --label-secondary: rgba(60,60,67,0.6);
  --label-tertiary: rgba(60,60,67,0.3);
  --fill-tertiary: rgba(118,118,128,0.12);
  --surround:#E5E5EA;
  --banner:rgba(255,255,255,0.96);
  --toast:rgba(28,28,30,0.92);
  --scrim:rgba(0,0,0,0.35);
  --shadow-strong:0 12px 30px rgba(0,0,0,0.18);
  --shadow-row:0 8px 20px rgba(0,0,0,0.18);
  --shadow-tint:0 2px 8px rgba(0,122,255,0.22);
  color-scheme:light;
}

/* ===== ダークモード ===== */
/* 「ダーク」を選択したとき */
html[data-theme="dark"]{
    --tint:#0A84FF;
    --red:#FF453A;
    --green:#30D158;
    --orange:#FF9F0A;
    --gray:#8E8E93;
    --bg:#000000;
    --card:#1C1C1E;
    --sep: rgba(84,84,88,0.65);
    --label:#FFFFFF;
    --label-secondary: rgba(235,235,245,0.6);
    --label-tertiary: rgba(235,235,245,0.3);
    --fill-tertiary: rgba(118,118,128,0.24);
    --surround:#000000;
    --banner:rgba(44,44,46,0.96);
    --toast:rgba(58,58,60,0.95);
    --scrim:rgba(0,0,0,0.55);
    --shadow-strong:0 12px 30px rgba(0,0,0,0.55);
    --shadow-row:0 8px 20px rgba(0,0,0,0.6);
    --shadow-tint:none;
    color-scheme:dark;
}
html[data-theme="dark"] .app-frame{box-shadow:none;}
html[data-theme="dark"] .hint-box{background:rgba(10,132,255,0.16);}

/* 「自動」のとき（＝端末の設定に追従） */
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --tint:#0A84FF;
    --red:#FF453A;
    --green:#30D158;
    --orange:#FF9F0A;
    --gray:#8E8E93;
    --bg:#000000;
    --card:#1C1C1E;
    --sep: rgba(84,84,88,0.65);
    --label:#FFFFFF;
    --label-secondary: rgba(235,235,245,0.6);
    --label-tertiary: rgba(235,235,245,0.3);
    --fill-tertiary: rgba(118,118,128,0.24);
    --surround:#000000;
    --banner:rgba(44,44,46,0.96);
    --toast:rgba(58,58,60,0.95);
    --scrim:rgba(0,0,0,0.55);
    --shadow-strong:0 12px 30px rgba(0,0,0,0.55);
    --shadow-row:0 8px 20px rgba(0,0,0,0.6);
    --shadow-tint:none;
    color-scheme:dark;
  }
  html[data-theme="auto"] .app-frame{box-shadow:none;}
  html[data-theme="auto"] .hint-box{background:rgba(10,132,255,0.16);}
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  min-height:100dvh;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}

/* ===== 画面いっぱいの器（PCでは中央に寄せる） ===== */
.app-frame{
  position:relative;
  width:100%;max-width:540px;
  height:100dvh;
  margin:0 auto;
  background:var(--bg);
}
.app-screen{
  position:relative;
  width:100%;height:100%;
  background:var(--bg);
  overflow:hidden;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
@media (min-width:600px){
  body{background:var(--surround);}
  .app-frame{box-shadow:0 0 0 1px rgba(60,60,67,0.12);}
}

/* ===== app root / screens ===== */
.app-root{position:relative;flex:1;overflow:hidden;background:var(--bg);}
.screen{
  position:absolute;inset:0;
  display:none;flex-direction:column;
  background:var(--bg);
}
.screen.active{display:flex;}
.push-screen{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;
  background:var(--bg);
  transform:translateX(100%);
  transition:transform .38s cubic-bezier(0.25,0.1,0.25,1);
}
.push-screen.show{transform:translateX(0);}
.picker-push-screen{z-index:500;}

/* nav bar */
.nav-bar{
  position:relative;z-index:30;
  flex:0 0 auto;
  background:var(--bg);
  border-bottom:0.5px solid transparent;
  transition:border-color .2s, background .2s;
}
.nav-bar.scrolled{
  border-bottom-color:var(--sep);
  background:rgba(242,242,247,0.88);
  backdrop-filter:blur(20px) saturate(180%);
}
.nav-bar-inner{
  height:44px;display:flex;align-items:center;justify-content:center;position:relative;
  padding:0 8px;
}
.nav-title{
  font-size:17px;font-weight:600;letter-spacing:-0.4px;
  opacity:0;transition:opacity .15s;
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nav-side{
  position:absolute;top:0;height:44px;display:flex;align-items:center;
  font-size:17px;color:var(--tint);
}
.nav-side.left{left:6px;}
.nav-side.right{right:12px;font-weight:400;}
.nav-back{display:flex;align-items:center;gap:1px;padding:6px 10px 6px 2px;border:none;background:none;color:var(--tint);font-size:17px;letter-spacing:-0.3px;}
.nav-back .chev{width:11px;height:18px;}
.nav-text-btn{border:none;background:none;color:var(--tint);font-size:17px;padding:6px 4px;font-weight:400;}
.nav-text-btn.bold{font-weight:600;}

.scroll-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
}
.large-title{
  font-size:34px;font-weight:700;letter-spacing:-0.4px;
  margin:4px 16px 12px;
  transition:opacity .1s;
  text-wrap:balance;
}
.picker-push-desc{
  white-space:pre-line;
  margin:-4px 16px 16px;
  font-size:13px;color:var(--label-secondary);line-height:1.6;
  white-space:pre-line;
}

/* ===== grouped list ===== */
.grouped-list{
  background:var(--card);
  border-radius:10px;
  margin:0 16px;
  overflow:hidden;
}
.list-row{
  min-height:44px;
  display:flex;align-items:center;gap:8px;
  padding:11px 16px;
  position:relative;
  background:var(--card);
}
.list-row.tappable:active{background:var(--fill-tertiary);}
.list-row + .list-row{box-shadow:inset 0 1px 0 var(--sep);}
.list-row.inset + .list-row.inset{box-shadow:none;}
.list-row.inset{padding-left:16px;}
.list-row.inset::after{
  content:"";position:absolute;left:16px;right:0;bottom:0;height:0.5px;background:var(--sep);
}
.list-row.inset:last-child::after{display:none;}
.row-label{font-size:17px;letter-spacing:-0.4px;color:var(--label);flex:1;}
.row-value{font-size:17px;color:var(--label-secondary);letter-spacing:-0.4px;}
.chevron{width:8px;height:14px;color:var(--label-tertiary);flex:0 0 8px;}

/* buttons */
.btn-filled{
  display:flex;align-items:center;justify-content:center;
  width:calc(100% - 32px);margin:20px 16px 0;height:50px;
  background:var(--tint);color:#fff;border:none;border-radius:12px;
  font-size:17px;font-weight:600;letter-spacing:-0.2px;
}
.btn-filled:active{opacity:0.4;}
.btn-filled[disabled]{background:var(--label-tertiary);}

.btn-calc{
  display:flex;align-items:center;justify-content:center;
  margin:22px auto 0;height:46px;min-width:190px;padding:0 32px;
  background:var(--tint);color:#fff;
  border:none;border-radius:14px;
  font-size:17px;font-weight:600;letter-spacing:-0.2px;
  box-shadow:var(--shadow-tint);
}
.btn-calc:active{opacity:0.55;}
.btn-calc[disabled]{background:var(--label-tertiary);box-shadow:none;}

/* switch */
.ios-switch{width:51px;height:31px;border-radius:16px;background:var(--label-tertiary);position:relative;transition:background .2s;flex:0 0 51px;}
.ios-switch.on{background:var(--green);}
.switch-knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,0.2);transition:transform .2s;}
.ios-switch.on .switch-knob{transform:translateX(20px);}

/* result card */
.result-card{
  margin:20px 16px 0;background:var(--card);border-radius:14px;
  padding:14px 16px;text-align:left;
  animation:popin .32s cubic-bezier(0.25,0.1,0.25,1);
}
@keyframes popin{from{opacity:0;transform:scale(0.94) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
.result-label{font-size:13px;font-weight:600;color:var(--label-secondary);letter-spacing:0.2px;margin-bottom:6px;}
.result-time{font-size:32px;font-weight:600;letter-spacing:0.5px;color:var(--tint);font-variant-numeric:tabular-nums;font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;}
.result-time-unit{font-size:13px;color:var(--label-secondary);margin-left:4px;font-weight:600;}
.result-row{display:flex;align-items:baseline;justify-content:flex-start;gap:6px;}
.result-row + .result-row{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--sep);}
.result-idx{font-size:15px;font-weight:600;color:var(--label-secondary);letter-spacing:-0.2px;flex:0 0 18px;}
.hint-box{margin:8px 16px 0;padding:10px 12px;background:rgba(0,122,255,0.08);border-radius:10px;font-size:12px;color:var(--tint);line-height:1.6;}

/* ===== ホーム画面に追加バナー ===== */
.a2hs{
  position:absolute;left:10px;right:10px;z-index:250;
  bottom:calc(14px + env(safe-area-inset-bottom));
  background:var(--banner);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-radius:16px;padding:14px 14px 14px 14px;
  box-shadow:var(--shadow-strong);
  transform:translateY(140%);opacity:0;
  transition:transform .42s cubic-bezier(0.25,0.1,0.25,1), opacity .3s;
  pointer-events:none;
}
.a2hs.show{transform:translateY(0);opacity:1;pointer-events:auto;}
.a2hs-top{display:flex;align-items:center;gap:11px;}
.a2hs-icon{
  flex:0 0 42px;width:42px;height:42px;border-radius:10px;
  background:linear-gradient(160deg,#0A5AE0,#2E9BFF);
  display:flex;align-items:center;justify-content:center;
}
.a2hs-icon svg{width:24px;height:24px;color:#fff;}
.a2hs-text{flex:1;min-width:0;}
.a2hs-title{font-size:15px;font-weight:600;letter-spacing:-0.3px;color:var(--label);}
.a2hs-sub{font-size:12.5px;color:var(--label-secondary);line-height:1.5;margin-top:2px;}
.a2hs-close{
  flex:0 0 24px;width:24px;height:24px;border:none;padding:0;border-radius:50%;
  background:var(--fill-tertiary);color:var(--label-secondary);
  display:flex;align-items:center;justify-content:center;align-self:flex-start;
}
.a2hs-close svg{width:11px;height:11px;}
.a2hs-steps{
  margin-top:11px;padding-top:11px;border-top:0.5px solid var(--sep);
  font-size:13px;color:var(--label);line-height:1.7;letter-spacing:-0.2px;
}
.a2hs-steps .share{
  display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;vertical-align:-4px;color:var(--tint);
}
.a2hs-steps .share svg{width:15px;height:17px;}
.a2hs-add{
  width:100%;height:40px;margin-top:11px;border:none;border-radius:11px;
  background:var(--tint);color:#fff;font-size:16px;font-weight:600;
}
.a2hs-add:active{opacity:.5;}

.app-version{
  margin:26px 16px 4px;text-align:center;
  font-size:11px;color:rgba(60,60,67,0.15);letter-spacing:0.3px;
}

/* overlays */
.overlay-backdrop{
  position:absolute;inset:0;background:var(--scrim);
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:300;
}
.overlay-backdrop.show{opacity:1;pointer-events:auto;}
.picker-option{display:flex;align-items:center;justify-content:space-between;}
.check-icon{width:18px;height:18px;color:var(--tint);flex:0 0 18px;}

.toast{
  position:absolute;bottom:100px;left:50%;z-index:400;
  transform:translateX(-50%) translateY(16px);
  background:var(--toast);color:#fff;
  padding:10px 20px;border-radius:14px;font-size:14px;font-weight:500;
  opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{width:16px;height:16px;color:var(--green);}

/* two-wave extra section */
.two-wave-extra{overflow:hidden;max-height:0;transition:max-height .3s ease;}
.two-wave-extra.open{max-height:200px;}

/* ===== section header / footer (iOS grouped list) ===== */
.list-header{
  margin:24px 32px 7px;
  font-size:13px;color:var(--label-secondary);letter-spacing:-0.08px;
}
.list-footer{
  margin:7px 32px 0;
  font-size:13px;color:var(--label-secondary);line-height:1.5;letter-spacing:-0.08px;
  white-space:pre-line;
}
.list-empty{
  padding:22px 16px;text-align:center;
  font-size:15px;color:var(--label-secondary);
}

/* ===== edit mode rows ===== */
.preset-row{transition:transform .22s cubic-bezier(0.25,0.1,0.25,1);}
.preset-row.no-anim{transition:none;}
.preset-row .row-slide{
  display:flex;align-items:center;gap:8px;flex:1;min-width:0;
  transition:transform .25s cubic-bezier(0.25,0.1,0.25,1);
  touch-action:pan-y;
}
/* スワイプ中：追従させるためアニメーションを切る */
.preset-row.swiping .row-slide{transition:none;}
.preset-row.swiping .row-delete{display:flex;}
.preset-row.confirming .row-slide{transform:translateX(-78px);}
.edit-minus{
  flex:0 0 22px;width:22px;height:22px;border:none;padding:0;margin-right:2px;
  border-radius:50%;background:var(--red);color:#fff;
  display:none;align-items:center;justify-content:center;
}
.editing .edit-minus{display:flex;}
.edit-minus span{display:block;width:11px;height:2px;border-radius:1px;background:#fff;}
.grip{
  display:none;flex:0 0 20px;width:20px;height:22px;
  align-items:center;justify-content:center;color:var(--label-tertiary);
  touch-action:none;cursor:grab;
}
.editing .grip{display:flex;}
.editing .check-icon{display:none;}
.grip span{display:block;width:18px;height:1.6px;border-radius:1px;background:currentColor;box-shadow:0 -5px 0 currentColor,0 5px 0 currentColor;}
.row-delete{
  position:absolute;top:0;right:0;bottom:0;width:78px;
  border:none;background:var(--red);color:#fff;font-size:16px;letter-spacing:-0.3px;
  display:none;align-items:center;justify-content:center;
  overflow:hidden;white-space:nowrap;padding:0;
}
.preset-row.confirming .row-delete{display:flex;}
.preset-row.dragging{
  z-index:10;background:var(--card);
  box-shadow:var(--shadow-row);
  transition:none;
}
.row-add .row-label{color:var(--tint);}
.plus-circle{
  flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--green);
  display:flex;align-items:center;justify-content:center;margin-right:2px;
}
.plus-circle svg{width:13px;height:13px;color:#fff;}

/* ===== wheel picker ===== */
.wheel-wrap{
  position:relative;margin:8px 16px 0;height:190px;
  background:var(--card);border-radius:10px;overflow:hidden;
  display:flex;align-items:stretch;
}
.wheel-band{
  position:absolute;left:10px;right:10px;top:50%;height:36px;
  transform:translateY(-50%);border-radius:8px;background:var(--fill-tertiary);
  pointer-events:none;
}
.wheel{
  flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);
          mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);
}
.wheel::-webkit-scrollbar{display:none;}
.wheel-pad{height:77px;}
.wheel-item{
  height:36px;display:flex;align-items:center;justify-content:center;
  scroll-snap-align:center;
  font-size:21px;letter-spacing:-0.3px;color:var(--label);
  font-variant-numeric:tabular-nums;
}
.wheel-item .unit{font-size:15px;color:var(--label-secondary);margin-left:4px;}
.btn-plain{
  display:flex;align-items:center;justify-content:center;
  width:calc(100% - 32px);margin:10px 16px 0;height:50px;
  background:var(--card);color:var(--tint);border:none;border-radius:12px;
  font-size:17px;font-weight:400;letter-spacing:-0.2px;
}
.btn-plain:active{background:var(--fill-tertiary);}
.btn-filled[disabled], .btn-plain[disabled]{color:var(--label-tertiary);}

/* focus visibility */
button:focus-visible, .list-row.tappable:focus-visible{outline:2px solid var(--tint);outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
}

/* ===== 現在時刻（UTC） ===== */
.now-block{margin:6px 16px 16px;}
.now-label{
  font-size:13px;font-weight:600;letter-spacing:0.2px;
  color:var(--label-secondary);margin-bottom:1px;
}
.now-time{
  font-size:30px;font-weight:600;letter-spacing:0.5px;color:var(--label);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  font-family:"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
.now-unit{font-size:13px;font-weight:600;color:var(--label-secondary);margin-left:4px;}
.now-note{
  margin-top:3px;font-size:12px;line-height:1.5;letter-spacing:-0.08px;
  color:var(--label-tertiary);
}
.now-note.warn{color:var(--orange);}
.now-note:empty{display:none;}

/* ===== 結果のカウントダウン ===== */
.result-time{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.result-cd{
  margin-left:auto;text-align:right;
  font-size:17px;font-weight:600;line-height:1.15;
  color:var(--label-secondary);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}
.result-cd .cd-cap{display:block;font-size:12px;font-weight:400;letter-spacing:0.1px;color:var(--label-tertiary);}
.result-cd.warn{color:var(--orange);}
.result-cd.crit{color:var(--red);}
.result-cd.done{color:var(--label-tertiary);}
.result-row.done .result-time,
.result-row.done .result-time-unit{color:var(--label-tertiary);}
</style>
</head>
<body>

<div class="app-frame">
  <div class="app-screen">
    <div class="app-root" id="app-root">

      <!-- ===== HOME (only screen) ===== -->
      <div class="screen active" data-tab="home" id="screen-home">
        <div class="nav-bar" id="nav-home">
          <div class="nav-bar-inner"><span class="nav-title">集結計算</span></div>
        </div>
        <div class="scroll-area" id="scroll-home">
          <div class="now-block">
            <div class="now-label">現在時刻</div>
            <div class="now-time"><span id="utc-clock">--:--:--</span><span class="now-unit">UTC</span></div>
            <div class="now-note" id="now-note"></div>
          </div>

          <div class="grouped-list">
            <div class="list-row inset tappable" id="row-rally-min" data-action="open-rally-picker">
              <span class="row-label">集結時間</span>
              <span class="row-value" id="val-rally-min">5分</span>
              <svg class="chevron" viewBox="0 0 8 14"><path d="M1 1L7 7L1 13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="list-row inset tappable" id="row-prep" data-action="open-prep-picker">
              <span class="row-label">準備時間</span>
              <span class="row-value" id="val-prep">1分</span>

      <!-- ===== picker push screen (settings-style drill-down) ===== -->
      <div class="push-screen picker-push-screen" id="screen-picker-push">
        <div class="nav-bar" id="nav-picker-push">

    <div class="a2hs" id="a2hs">
      <div class="a2hs-top">

        <div class="a2hs-text">

        下の<span class="share"><svg viewBox="0 0 15 17" fill="none"><path d="M7.5 1v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.3 4.2L7.5 1l3.2 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 7.5H1.5V16h12V7.5H12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>を押して、「ホーム画面に追加」を選んでください。
      </div>

    <!-- ===== overlays ===== -->
    <div class="overlay-backdrop" id="overlay-backdrop"></div>

    <div class="toast" id="toast">
      <svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4L16 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="toast-text">コピーしました</span>
    </div>

  </div><!-- /app-screen -->
</div><!-- /app-frame -->

<script>
(function(){
  'use strict';

  /* ===================== state ===================== */
  const state = {
    rallyMin: 5,
    prepSec: 60,
    twoWave: false,
    diffTotalSec: 60
  };

  /* ===================== helpers ===================== */
  function pad2(n){ return String(n).padStart(2,'0'); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function marchLabel(sec){
    const m = Math.floor(sec/60), s = sec%60;
    if(m===0) return `${s}秒`;
    if(s===0) return `${m}分`;
    return `${m}分${s}秒`;
  }
  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }

  /* ===================== toast ===================== */
  let toastTimer = null;
  function showToast(msg){
    const t = $('#toast');
    $('#toast-text').textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
  }

  /* ===================== overlay system ===================== */
  let activeOverlay = null;
  function showOverlayEl(el){
    $('#overlay-backdrop').classList.add('show');
    el.classList.add('show');
    activeOverlay = el;
  }
  function hideOverlay(){
    $('#overlay-backdrop').classList.remove('show');
    if(activeOverlay) activeOverlay.classList.remove('show');
    activeOverlay = null;
  }
  $('#overlay-backdrop').addEventListener('click', hideOverlay);

  /* ===================== picker push screen (settings-style, generic) ===================== */
  function openPicker(title, options, currentValue, onSelect, description){
    $('#picker-push-title').textContent = title;
    $('#picker-push-large-title').textContent = title;
    $('#scroll-picker-push').scrollTop = 0;
    const descEl = $('#picker-push-desc');
    if(description){
      descEl.textContent = description;
      descEl.style.display = 'block';
    } else {
      descEl.style.display = 'none';
    }
    const list = $('#picker-push-list');
    list.innerHTML = options.map(o => `
      <div class="list-row inset tappable picker-option" data-value="${escapeHtml(String(o.value))}">
        <span class="row-label">${escapeHtml(o.label)}</span>
        ${String(o.value)===String(currentValue) ? '<svg class="check-icon" viewBox="0 0 20 20"><path d="M4 10.5l4 4L16 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
      </div>`).join('');
    $all('.picker-option', list).forEach(row=>{
      row.addEventListener('click', ()=>{
        closePickerPush();
        onSelect(row.dataset.value);
      });
    });
    $('#screen-picker-push').classList.add('show');
  }
  function closePickerPush(){
    $('#screen-picker-push').classList.remove('show');
  }
  $('#btn-picker-back').addEventListener('click', closePickerPush);

  /* ===================== copy ===================== */
  function copyText(text){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.opacity='0'; ta.style.top='0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){ /* clipboard not available in this environment - toast still confirms the action */ }
    showToast('コピーしました');
  }

  /* ===================== nav large-title scroll shrink ===================== */
  function bindScrollTitle(scrollId, navId){
    const scrollEl = document.getElementById(scrollId);
    const navEl = document.getElementById(navId);
    if(!scrollEl || !navEl) return;
    const largeTitle = scrollEl.querySelector('.large-title');
    const smallTitle = navEl.querySelector('.nav-title');
    scrollEl.addEventListener('scroll', ()=>{
      const y = scrollEl.scrollTop;
      const progress = Math.min(1, Math.max(0, y/32));
      if(smallTitle) smallTitle.style.opacity = String(progress);
      if(largeTitle) largeTitle.style.opacity = String(Math.max(0, 1 - progress*1.6));
      navEl.classList.toggle('scrolled', progress > 0.92);
    }, {passive:true});
  }
  bindScrollTitle('scroll-home','nav-home');
  bindScrollTitle('scroll-picker-push','nav-picker-push');
  bindScrollTitle('scroll-preset','nav-preset');
  bindScrollTitle('scroll-custom','nav-custom');

  /* ===================== HOME ===================== */
  /* ===================== 外観（自動 / ライト / ダーク） ===================== */
  const THEME_OPTIONS = [
    { value:'auto',  label:'自動（端末の設定に合わせる）' },
    { value:'light', label:'ライト' },
    { value:'dark',  label:'ダーク' }
  ];
  const THEME_SHORT = { auto:'自動', light:'ライト', dark:'ダーク' };

  function currentTheme(){
    return document.documentElement.getAttribute('data-theme') || 'auto';
  }
  function isDarkNow(){
    const t = currentTheme();
    if(t === 'dark') return true;
    if(t === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('shuketsu.theme', t); }catch(e){}
    const meta = $('#meta-theme-color');
    if(meta) meta.setAttribute('content', isDarkNow() ? '#000000' : '#F2F2F7');
    const el = $('#val-theme');
    if(el) el.textContent = THEME_SHORT[t] || '自動';
  }
  applyTheme(currentTheme());
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = ()=>{ if(currentTheme()==='auto') applyTheme('auto'); };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }

  const RALLY_OPTIONS = [1,2,3,5,10];

  $('#row-rally-min').addEventListener('click', ()=>{
    const opts = RALLY_OPTIONS.map(v=>({value:v,label:v+'分'}));
    openPicker('集結時間', opts, state.rallyMin, (val)=>{
      state.rallyMin = parseInt(val,10);
      $('#val-rally-min').textContent = state.rallyMin+'分';
    });
  });

  /* ===================== よく使う時間（準備時間 / 時差 共通） ===================== */
  const PRESET_KINDS = {
    prep: {
      title: '準備時間',
      desc: '①一番遅い人の行軍時間＋②集結を発起するまでの時間を設定\n（例：50秒＋1分＝1分50秒）',
      storeKey: 'shuketsu.prepPresets.v1',
      defaults: [60,90,110,120,150,180],
      maxMin: 30,
      valueEl: '#val-prep',
      get: ()=> state.prepSec,
      set: (v)=>{ state.prepSec = v; }
    },
    diff: {
      title: '時差',
      desc: '一段目の着弾から二段目の着弾までの間隔を設定',
      storeKey: 'shuketsu.diffPresets.v1',
      defaults: [30,60,90,120,180,300],
      maxMin: 10,
      valueEl: '#val-diff',
      get: ()=> state.diffTotalSec,
      set: (v)=>{ state.diffTotalSec = v; }
    }
  };

  let cur = PRESET_KINDS.prep;   // いま開いている種類
  let editing = false;

  function loadPresets(kind){
    try{
      const raw = localStorage.getItem(kind.storeKey);
      if(raw){
        const arr = JSON.parse(raw);
        if(Array.isArray(arr) && arr.every(n => Number.isInteger(n) && n>0)) return arr;
      }
      return kind.defaults.slice();
    }catch(e){
      return kind.mem ? kind.mem.slice() : kind.defaults.slice();
    }
  }
  function savePresets(){
    cur.mem = cur.presets.slice();
    try{ localStorage.setItem(cur.storeKey, JSON.stringify(cur.presets)); }catch(e){}
  }
  Object.keys(PRESET_KINDS).forEach(k=>{
    const kind = PRESET_KINDS[k];
    kind.presets = loadPresets(kind);
  });

  const CHECK_SVG = '<svg class="check-icon" viewBox="0 0 20 20"><path d="M4 10.5l4 4L16 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function presetRowHtml(sec){
    return `
      <div class="list-row inset tappable preset-row" data-sec="${sec}">
        <button class="edit-minus" type="button" aria-label="${escapeHtml(marchLabel(sec))}を削除"><span></span></button>
        <div class="row-slide">
          <span class="row-label">${escapeHtml(marchLabel(sec))}</span>
          ${sec===cur.get() ? CHECK_SVG : ''}
          <div class="grip" aria-label="並べ替え"><span></span></div>
        </div>
        <button class="row-delete" type="button">削除</button>
      </div>`;
  }
  const ADD_ROW_HTML = `
      <div class="list-row inset tappable row-add" id="row-add-preset">
        <div class="plus-circle"><svg viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
        <span class="row-label">時間を追加</span>
      </div>`;

  function renderPresets(){
    const list = $('#preset-list');
    let html = cur.presets.length
      ? cur.presets.map(presetRowHtml).join('')
      : (editing ? '' : '<div class="list-empty">よく使う時間はありません</div>');
    if(editing) html += ADD_ROW_HTML;
    list.innerHTML = html;
    list.classList.toggle('editing', editing);

    $all('.preset-row', list).forEach(row=>{
      const sec = parseInt(row.dataset.sec,10);
      row.addEventListener('click', (ev)=>{
        if(ev.target.closest('.row-delete') || ev.target.closest('.edit-minus') || ev.target.closest('.grip')) return;
        if(row._swiped){ row._swiped = false; return; }
        if(row.classList.contains('confirming')){ clearConfirming(); return; }
        if(editing){ clearConfirming(); return; }
        applyValue(sec);
        closePreset();
      });
      $('.edit-minus', row).addEventListener('click', ()=>{
        const on = row.classList.contains('confirming');
        clearConfirming();
        row.classList.toggle('confirming', !on);
      });
      $('.row-delete', row).addEventListener('click', ()=>{
        cur.presets = cur.presets.filter(v => v!==sec);
        savePresets();
        renderPresets();
      });
      bindSwipe(row);
      bindDrag($('.grip', row), row);
    });

    const scrollPreset = $('#scroll-preset');
    if(scrollPreset && !scrollPreset._closeBound){
      scrollPreset._closeBound = true;
      scrollPreset.addEventListener('click', (ev)=>{
        if(!ev.target.closest('.preset-row')) clearConfirming();
      });
    }

    const addRow = $('#row-add-preset', list);
    if(addRow) addRow.addEventListener('click', openCustom);

    $('#preset-footer').style.display = (editing && cur.presets.length>1) ? 'block' : 'none';
    $('#preset-swipe-hint').style.display = (!editing && cur.presets.length) ? 'block' : 'none';
  }
  function clearConfirming(except){
    $all('.preset-row.confirming').forEach(r => {
      if(r !== except) r.classList.remove('confirming');
    });
  }
  function applyValue(sec){
    cur.set(sec);
    $(cur.valueEl).textContent = marchLabel(sec);
  }

  /* --- 左スワイプで削除を表示 --- */
  const SWIPE_W = 78;
  function bindSwipe(row){
    const slide = $('.row-slide', row);
    const del = $('.row-delete', row);
    if(!slide || !del) return;
    row.style.touchAction = 'pan-y';
    let startX=0, startY=0, dx=0, active=false, decided=false, horiz=false;

    row.addEventListener('pointerdown', (ev)=>{
      if(ev.pointerType === 'mouse' && ev.button !== 0) return;
      if(ev.target.closest('.grip') || ev.target.closest('.row-delete') || ev.target.closest('.edit-minus')) return;
      startX = ev.clientX; startY = ev.clientY;
      dx = 0; active = true; decided = false; horiz = false;
      row._swiped = false;
    });

    row.addEventListener('pointermove', (ev)=>{
      if(!active) return;
      const mx = ev.clientX - startX, my = ev.clientY - startY;
      if(!decided){
        if(Math.abs(mx) < 4 && Math.abs(my) < 4) return;
        decided = true;
        horiz = Math.abs(mx) > Math.abs(my);
        if(!horiz) { active = false; return; }
        clearConfirming(row);
        row.classList.add('swiping');
        try{ row.setPointerCapture(ev.pointerId); }catch(e){}
      }
      if(!horiz) return;
      ev.preventDefault();
      const base = row.classList.contains('confirming') ? -SWIPE_W : 0;
      dx = Math.max(-SWIPE_W, Math.min(0, base + mx));
      slide.style.transform = 'translateX(' + dx + 'px)';
      del.style.width = Math.abs(dx) + 'px';
      row._swiped = true;
    });

    function endSwipe(){
      if(!active && !horiz) return;
      active = false;
      if(!horiz) return;
      horiz = false;
      row.classList.remove('swiping');
      slide.style.transform = '';
      del.style.width = '';
      row.classList.toggle('confirming', dx < -SWIPE_W/2);
    }
    row.addEventListener('pointerup', endSwipe);
    row.addEventListener('pointercancel', endSwipe);
    row.addEventListener('lostpointercapture', endSwipe);
  }

  /* --- 並べ替え（ハンドルをドラッグ） --- */
  function bindDrag(handle, row){
    if(!handle) return;
    handle.addEventListener('pointerdown', (ev)=>{
      if(!editing) return;
      ev.preventDefault();
      clearConfirming();
      const list = $('#preset-list');
      const rows = $all('.preset-row', list);
      const h = row.offsetHeight;
      const startIdx = rows.indexOf(row);
      const startY = ev.clientY;
      let curIdx = startIdx;
      handle.setPointerCapture(ev.pointerId);
      row.classList.add('dragging');

      function onMove(e){
        const dy = e.clientY - startY;
        row.style.transform = `translateY(${dy}px)`;
        const next = Math.max(0, Math.min(rows.length-1, startIdx + Math.round(dy/h)));
        if(next !== curIdx){
          curIdx = next;
          rows.forEach((r,i)=>{
            if(r===row) return;
            let shift = 0;
            if(startIdx < curIdx && i>startIdx && i<=curIdx) shift = -h;
            else if(curIdx < startIdx && i>=curIdx && i<startIdx) shift = h;
            r.style.transform = shift ? `translateY(${shift}px)` : '';
          });
        }
      }
      function onUp(){
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        handle.removeEventListener('pointercancel', onUp);
        rows.forEach(r=>{ r.style.transform=''; });
        row.classList.remove('dragging');
        if(curIdx !== startIdx){
          const moved = cur.presets.splice(startIdx,1)[0];
          cur.presets.splice(curIdx,0,moved);
          savePresets();
        }
        renderPresets();
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
      handle.addEventListener('pointercancel', onUp);
    });
  }

  /* --- よく使う時間の画面 --- */
  function openPreset(kindName){
    cur = PRESET_KINDS[kindName];
    editing = false;
    $('#preset-nav-title').textContent = cur.title;
    $('#preset-large-title').textContent = cur.title;
    $('#preset-desc').textContent = cur.desc;
    $('#custom-back-label').textContent = cur.title;
    $('#btn-preset-edit').textContent = '編集';
    $('#btn-preset-edit').classList.remove('bold');
    $('#scroll-preset').scrollTop = 0;
    renderPresets();
    $('#screen-preset').classList.add('show');
  }
  function closePreset(){ $('#screen-preset').classList.remove('show'); }
  $('#row-prep').addEventListener('click', ()=> openPreset('prep'));
  $('[data-action="open-diff-picker"]').addEventListener('click', ()=> openPreset('diff'));

  $('#btn-preset-back').addEventListener('click', closePreset);
  $('#btn-preset-edit').addEventListener('click', function(){
    editing = !editing;
    this.textContent = editing ? '完了' : '編集';
    this.classList.toggle('bold', editing);
    clearConfirming();
    renderPresets();
  });

  /* --- 時間を追加（分・秒ホイール） --- */
  const WHEEL_H = 36;
  const MAX_MIN = 30;
  function buildWheel(el, max, unit){
    el.innerHTML = '<div class="wheel-pad"></div>'
      + Array.from({length:max+1},(_,i)=>`<div class="wheel-item">${i}<span class="unit">${unit}</span></div>`).join('')
      + '<div class="wheel-pad"></div>';
  }
  buildWheel($('#wheel-min'), MAX_MIN, '分');
  buildWheel($('#wheel-sec'), 59, '秒');
  function wheelValue(el){ return Math.round(el.scrollTop / WHEEL_H); }
  function setWheel(el, v){ el.scrollTop = v * WHEEL_H; }
  function customTotal(){ return wheelValue($('#wheel-min'))*60 + wheelValue($('#wheel-sec')); }
  function updateCustomPreview(){
    const total = customTotal();
    $('#custom-preview').textContent = total ? marchLabel(total) : '0秒は設定できません';
    $('#btn-custom-add').disabled  = total===0;
  }
  let wheelRaf = null;
  ['#wheel-min','#wheel-sec'].forEach(sel=>{
    $(sel).addEventListener('scroll', ()=>{
      if(wheelRaf) cancelAnimationFrame(wheelRaf);
      wheelRaf = requestAnimationFrame(updateCustomPreview);
    }, {passive:true});
  });

  function openCustom(){
    const base = cur.get();
    // 種類ごとに分の上限を出し分ける（時差は10分まで）
    $all('#wheel-min .wheel-item').forEach((el,i)=>{
      el.style.display = i > cur.maxMin ? 'none' : 'flex';
    });
    $('#scroll-custom').scrollTop = 0;
    $('#screen-custom').classList.add('show');
    requestAnimationFrame(()=>{
      setWheel($('#wheel-min'), Math.min(cur.maxMin, Math.floor(base/60)));
      setWheel($('#wheel-sec'), base%60);
      updateCustomPreview();
    });
  }
  function closeCustom(){ $('#screen-custom').classList.remove('show'); }
  $('#btn-custom-back').addEventListener('click', closeCustom);

  $('#btn-custom-add').addEventListener('click', ()=>{
    const total = customTotal();
    if(!total) return;
    if(cur.presets.includes(total)){
      showToast('すでに追加されています');
    } else {
      cur.presets.push(total);
      savePresets();
      showToast('よく使う時間に追加しました');
    }
    renderPresets();
    closeCustom();
  });

  $('#two-wave-switch').addEventListener('click', function(){
    state.twoWave = !state.twoWave;
    this.classList.toggle('on', state.twoWave);
    $('#two-wave-extra').classList.toggle('open', state.twoWave);
  });

  function computeLanding(afterSec){
    const now = new Date(nowMs());
    let target = new Date(now.getTime() + afterSec*1000);
    const roundedSec = Math.ceil(target.getUTCSeconds()/10)*10;
    target = new Date(Date.UTC(
      target.getUTCFullYear(), target.getUTCMonth(), target.getUTCDate(),
      target.getUTCHours(), target.getUTCMinutes(), 0
    ) + roundedSec*1000);
    return target;
  }
  function fmtUTC(d){ return `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}`; }

  /* ===================== 標準時への同期 ===================== */
  /* 端末時計は数秒ずれていることがあるため、サーバー応答の Date ヘッダーを基準にする。
     往復時間の半分を足して送信時刻を推定し、最も往復の速かった測定を採用する。 */
  var clockOffset = 0;      // 標準時 - 端末時計（ミリ秒）
  var clockSynced = false;
  var lastSyncAt = 0;

  function nowMs(){ return Date.now() + clockOffset; }

  function sampleOffset(){
    var t0 = Date.now();
    return fetch(location.pathname + '?t=' + t0, { method:'HEAD', cache:'no-store' })
      .then(function(res){
        var header = res.headers.get('Date');
        if(!header) return null;
        var serverMs = new Date(header).getTime();
        if(isNaN(serverMs)) return null;
        var t1 = Date.now();
        var rtt = t1 - t0;
        if(rtt > 4000) return null;
        /* Date は秒単位に切り捨てられるため、期待値として 500ms を足す */
        return { offset: (serverMs + 500) - (t0 + rtt/2), rtt: rtt };
      })
      .catch(function(){ return null; });
  }

  function syncClock(){
    if(!window.fetch) return;
    Promise.all([sampleOffset(), sampleOffset(), sampleOffset()]).then(function(list){
      var best = null;
      list.forEach(function(r){
        if(r && (!best || r.rtt < best.rtt)) best = r;
      });
      if(!best) { renderClockNote(); return; }
      clockOffset = Math.round(best.offset);
      clockSynced = true;
      lastSyncAt = Date.now();
      renderLive();
    });
  }

  function renderClockNote(){
    var el = $('#now-note');
    if(!el) return;
    if(!clockSynced){
      el.className = 'now-note';
      el.textContent = '標準時に同期できていません（端末の時計を表示中）';
      return;
    }
    var gapSec = Math.round(clockOffset/1000);
    if(Math.abs(gapSec) >= 2){
      el.className = 'now-note warn';
      el.textContent = '端末の時計が' + Math.abs(gapSec) + '秒'
        + (gapSec > 0 ? '遅れています' : '進んでいます') + '（表示は標準時に補正済み）';
    } else {
      el.className = 'now-note';
      el.textContent = '標準時に同期済み';
    }
  }

  /* ===================== 現在時刻とカウントダウン ===================== */
  var live = null;   // { hit1, start1, hit2, start2 }

  function mmss(ms){
    var t = Math.max(0, Math.ceil(ms/1000));
    return Math.floor(t/60) + ':' + pad2(t%60);
  }
  function paintCd(el, row, hit, start, now){
    var left = hit - now;
    el.className = 'result-cd';
    row.classList.remove('done');
    if(left <= 0){
      row.classList.add('done');
      el.classList.add('done');
      el.innerHTML = '着弾';
    } else if(now < start){
      el.innerHTML = mmss(start-now) + '<span class="cd-cap">集結開始まで</span>';
    } else {
      if(left <= 10000) el.classList.add('crit');
      else if(left <= 30000) el.classList.add('warn');
      el.innerHTML = mmss(left) + '<span class="cd-cap">着弾まで</span>';
    }
  }
  function clearLive(){
    live = null;
    $('#home-result').style.display = 'none';
    $('#home-result-cd').innerHTML = '';
    $('#home-result-cd2').innerHTML = '';
    $('#home-result-cd').className = 'result-cd';
    $('#home-result-cd2').className = 'result-cd';
    $('#home-result-time').parentNode.classList.remove('done');
    $('#home-result2-row').classList.remove('done');
  }
  function renderLive(){
    var now = nowMs();
    $('#utc-clock').textContent = fmtUTC(new Date(now));
    renderClockNote();
    if(!live) return;
    var last = live.hit2 || live.hit1;
    if(now - last > 60000){ clearLive(); return; }
    paintCd($('#home-result-cd'), $('#home-result-time').parentNode, live.hit1, live.start1, now);
    if(live.hit2){
      paintCd($('#home-result-cd2'), $('#home-result2-row'), live.hit2, live.start2, now);
    }
  }
  function tickLive(){
    renderLive();
    setTimeout(tickLive, 1000 - (nowMs() % 1000));
  }
  tickLive();
  syncClock();
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    renderLive();
    if(Date.now() - lastSyncAt > 300000) syncClock();
  });
  window.addEventListener('online', syncClock);

  $('#btn-home-calc').addEventListener('click', function(){
    const btn = this;
    btn.textContent = '計算中…';
    btn.disabled = true;
    setTimeout(()=>{
      const totalSec = state.prepSec + state.rallyMin*60;
      const target = computeLanding(totalSec);
      const timeStr = fmtUTC(target);
      let timeStr2 = null;
      if(state.twoWave){
        const target2 = new Date(target.getTime() + state.diffTotalSec*1000);
        timeStr2 = fmtUTC(target2);
      }
      $('#home-result-idx').style.display = state.twoWave ? 'inline' : 'none';
      $('#home-result-time').textContent = timeStr;
      $('#home-result').style.display = 'block';
      if(state.twoWave){
        $('#home-result-time2').textContent = timeStr2;
        $('#home-result2-row').style.display = 'flex';
      } else {
        $('#home-result2-row').style.display = 'none';
      }
      btn.textContent = '計算開始';
      btn.disabled = false;

      const rallyMs = state.rallyMin*60*1000;
      live = {
        hit1: target.getTime(),
        start1: target.getTime() - rallyMs,
        hit2: state.twoWave ? target.getTime() + state.diffTotalSec*1000 : null,
        start2: state.twoWave ? target.getTime() + state.diffTotalSec*1000 - rallyMs : null
      };
      renderLive();

      const msg = buildCopyMessage(timeStr, timeStr2);
      copyText(msg);
    }, 450);
  });

  function buildCopyMessage(timeStr, timeStr2){
    if(timeStr2){
      return `${state.rallyMin}分集結お願いします。🙇\n①【${timeStr} UTC】着弾\n②【${timeStr2} UTC】着弾`;
    }
    return `${state.rallyMin}分集結お願いします。🙇\n【${timeStr} UTC】着弾`;
  }

  /* ===================== ホーム画面に追加のおすすめ ===================== */
  (function(){
    var KEY = 'shuketsu.a2hs.dismissed.v1';
    var banner = $('#a2hs');
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
                || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var installed = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                    || navigator.standalone === true;
    var dismissed = false;
    try{ dismissed = localStorage.getItem(KEY) === '1'; }catch(e){}
    if(installed || dismissed) return;

    var deferred = null;
    function show(){ setTimeout(function(){ banner.classList.add('show'); }, 1200); }
    function hide(remember){
      banner.classList.remove('show');
      if(remember){ try{ localStorage.setItem(KEY, '1'); }catch(e){} }
    }

    $('#a2hs-close').addEventListener('click', function(){ hide(true); });

    // Android / PC の Chrome 系：OSの追加ダイアログを出せる
    window.addEventListener('beforeinstallprompt', function(ev){
      ev.preventDefault();
      deferred = ev;
      $('#a2hs-steps').style.display = 'none';
      $('#a2hs-add').style.display = 'block';
      show();
    });
    $('#a2hs-add').addEventListener('click', async function(){
      if(!deferred) return;
      hide(false);
      deferred.prompt();
      try{ await deferred.userChoice; }catch(e){}
      deferred = null;
    });
    window.addEventListener('appinstalled', function(){ hide(true); });

    // iPhone / iPad：自動で出せないので手順を案内する
    if(isIOS) show();
  })();

  /* ===================== boot ===================== */
  $('#val-rally-min').textContent = state.rallyMin+'分';

})();
</script>

</body>
</html>
